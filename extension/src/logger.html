<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Groveguard logs</title><link rel="stylesheet" href="wp.css">
<style>.e{padding:8px 0;border-bottom:1px solid #222}.e .h{font-size:18px}.e .u{color:#8a8a8a;font-size:12px;word-break:break-all}
.blk .h{color:#ff6b5b}.e button{font-size:14px;min-height:34px;padding:4px 12px;margin:6px 6px 0 0}
.chips button{font-size:15px;min-height:36px;padding:4px 14px}.chips button.on{background:#60a917}.chips button:not(.on){background:transparent;border:1.5px solid #888}</style>

<div class="app">GROVEGUARD</div><h1>logs</h1>

<input id="q" placeholder="search" style="width:100%;box-sizing:border-box;margin-top:10px;background:#ddd;color:#000;border:0;padding:10px;font-size:16px">
<p class="dim" id="st"></p><button class="o" id="clear">clear</button>
<div id="list"></div>
</main><script src="logger.js"></script></body></html>
